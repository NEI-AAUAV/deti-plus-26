server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Keep the port when redirecting (the container is usually published on a
    # non-80 host port).
    absolute_redirect off;

    # Mirror the GitHub Pages URL shape so local runs exercise the same paths.
    location = / {
        return 302 /deti-plus-26/;
    }

    location /deti-plus-26/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /deti-plus-26/404.html;
}
